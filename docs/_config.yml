# Jekyll configuration for the documentation site published from this folder
# (GitHub Pages -> Settings -> Pages -> Source: Deploy from a branch -> /docs).
#
# The same Markdown files are used by the GitHub wiki, where docs/_Sidebar.md is
# the side menu. This configuration gives the Pages rendering the same side menu
# through docs/_layouts/default.html and docs/_data/navigation.yml.
title: SimpleXisoDrive
description: Read-only Xbox ISO/XISO/CISO/CHD and ZArchive mounts on Windows, Linux and macOS.
lang: en

# GitHub Pages auto-loads these whitelisted plugins; listing them keeps a local
# `jekyll build` (with the github-pages gem) in sync with the hosted site.
plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links

relative_links:
  enabled: true

optional_front_matter:
  enabled: true
  remove_originals: false

# Every Markdown page in this folder uses the side-menu layout. The layout is
# opt-in for the wiki (which ignores underscored files), so this only affects Pages.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

exclude:
  - _Sidebar.md
  - _Footer.md
