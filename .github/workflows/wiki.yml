name: Wiki

# Mirrors docs/ into the GitHub wiki (Home + sidebar + pages) on every docs
# change. docs/ is the single source of truth; the same pages are published to
# the documentation site by .github/workflows/pages.yml. Commits only when the
# generated content differs, so the workflow is idempotent.

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/sync-wiki.ps1'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  sync:
    name: sync docs to wiki
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v7
        with:
          path: main

      - name: Checkout wiki repository
        uses: actions/checkout@v7
        with:
          # The wiki is a separate repository but the workflow token can write
          # to it when `contents: write` is granted above.
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Regenerate wiki pages
        shell: pwsh
        run: ./main/.github/sync-wiki.ps1 -DocsDir ./main/docs -WikiDir ./wiki

      - name: Push if changed
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
          else
            git commit -m "docs: sync wiki from docs/ (${{ github.sha }})"
            git push
          fi
