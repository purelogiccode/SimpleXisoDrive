name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Read-only: this workflow only builds, tests, and uploads action artifacts.
permissions:
  contents: read

# Cancel superseded PR runs; never cancel a push run mid-build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: build-and-test
    # The app targets net10.0-windows and DokanNet; only Windows runners can run it.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        # 10.0.x, not `global-json-file`: the repo pins `10.0.0` with
        # rollForward latestMajor, which setup-dotnet cannot resolve.
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Restore
        run: dotnet restore CSharp_SimpleXisoDrive.sln

      - name: Build
        run: dotnet build CSharp_SimpleXisoDrive.sln --no-restore --configuration Release

      - name: Test
        # --blame-hang-dump-type none: hang dumps are too large to upload, so skip
        # collecting them and abort faster on a hung test host.
        run: >-
          dotnet test CSharp_SimpleXisoDrive.sln
          --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults
          --blame-hang-timeout 15m
          --blame-hang-dump-type none

      - name: Upload test results
        # Always: the trx of a failed run carries the failing test and timings.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
